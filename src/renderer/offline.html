<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';"
  />
  <title>Connection Error — YouTube Music</title>
  <link rel="stylesheet" href="offline.css" />
</head>
<body>
  <main class="card">
    <div class="icon-ring" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/>
      </svg>
    </div>

    <h1 id="heading">Unable to load YouTube Music</h1>
    <p id="subtitle" class="subtitle">
      Please check your internet connection, VPN, or proxy settings and try again.
    </p>

    <div id="detailsBox" class="details">
      <div id="errorRow" class="detail-row is-hidden">
        <span id="errorCodeLabel" class="detail-label">Error code:</span>
        <span id="errorValue" class="detail-val"></span>
      </div>
      <div id="urlRow" class="detail-row is-hidden">
        <span id="urlLabel" class="detail-label">URL:</span>
        <span id="urlValue" class="detail-val"></span>
      </div>
    </div>

    <button id="retryBtn" class="retry-btn" type="button">
      <svg id="retryIcon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
      <span id="retryLabel">Retry Connection</span>
    </button>

    <div id="hint" class="hint">Tip: press Enter or R to retry quickly.</div>
  </main>

  <script src="offline.js"></script>
</body>
</html>
