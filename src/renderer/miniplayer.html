<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: https:;" />
  <title>YouTube Music — Міні-плеєр</title>
  <style>
    :root {
      --c1: rgba(255, 45, 85, 0.28);
      --c2: rgba(90, 60, 200, 0.24);
      --accent: rgb(255, 45, 85);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Roboto, sans-serif;
      color: #f4f4f6;
      background:
        radial-gradient(circle at 15% 20%, var(--c1) 0%, transparent 62%),
        radial-gradient(circle at 85% 85%, var(--c2) 0%, transparent 62%),
        #121216;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 10px 14px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      -webkit-app-region: drag;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.72);
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .win-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.11);
      color: #ffffff;
    }

    .icon-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: var(--accent);
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .cover-wrap {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-placeholder {
      width: 26px;
      height: 26px;
      color: rgba(255, 255, 255, 0.35);
    }

    .meta {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-section {
      margin-top: 12px;
    }

    .progress-bar {
      position: relative;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.15s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.5);
      font-variant-numeric: tabular-nums;
    }

    .controls-row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .ctrl-btn:active {
      transform: scale(0.94);
    }

    .ctrl-btn.primary {
      width: 38px;
      height: 38px;
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .ctrl-btn.primary:hover {
      filter: brightness(1.08);
      background: var(--accent);
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 112px;
    }

    .volume-wrap svg {
      color: rgba(255, 255, 255, 0.65);
      flex-shrink: 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>YouTube Music</span>
      </div>
      <div class="win-actions">
        <button id="pinBtn" class="icon-btn" title="Закріпити поверх вікон">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
          </svg>
        </button>
        <button id="openMainBtn" class="icon-btn" title="Відкрити головне вікно">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
        </button>
        <button id="closeBtn" class="icon-btn" title="Сховати міні-плеєр">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="track-row">
      <div class="cover-wrap">
        <img id="coverImg" alt="" />
        <svg id="coverPlaceholder" class="cover-placeholder" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <div class="meta">
        <div id="trackTitle" class="track-title">Нічого не відтворюється</div>
        <div id="trackArtist" class="track-artist">YouTube Music</div>
      </div>
    </div>

    <div class="progress-section">
      <div id="progressBar" class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="totTime">0:00</span>
      </div>
    </div>

    <div class="controls-row">
      <div class="transport">
        <button id="prevBtn" class="ctrl-btn" title="Попередній трек">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
          </svg>
        </button>
        <button id="playPauseBtn" class="ctrl-btn primary" title="Відтворити / Пауза">
          <svg id="playIcon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pauseIcon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>
        <button id="nextBtn" class="ctrl-btn" title="Наступний трек">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
            <path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>

      <div class="volume-wrap" title="Гучність">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
        <input id="volumeRange" type="range" min="0" max="100" value="100" />
      </div>
    </div>
  </div>

  <script>
    const coverImg = document.getElementById('coverImg');
    const coverPlaceholder = document.getElementById('coverPlaceholder');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const curTimeEl = document.getElementById('curTime');
    const totTimeEl = document.getElementById('totTime');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const pinBtn = document.getElementById('pinBtn');
    const volumeRange = document.getElementById('volumeRange');

    let durationSec = 0;
    let isAdjustingVolume = false;

    function fmtTime(sec) {
      if (!Number.isFinite(sec) || sec <= 0) return '0:00';
      const total = Math.floor(sec);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function updateProgress(current) {
      curTimeEl.textContent = fmtTime(current);
      totTimeEl.textContent = fmtTime(durationSec);
      const pct = durationSec > 0 ? Math.min(100, Math.max(0, (current / durationSec) * 100)) : 0;
      progressFill.style.width = `${pct}%`;
    }

    window.miniPlayerAPI.onStateUpdate((state) => {
      if (!state) return;
      trackTitle.textContent = state.title || 'Нічого не відтворюється';
      trackArtist.textContent = state.artist || 'YouTube Music';
      durationSec = state.duration || 0;
      updateProgress(state.currentTime || 0);

      const playing = Boolean(state.isPlaying);
      playIcon.style.display = playing ? 'none' : 'block';
      pauseIcon.style.display = playing ? 'block' : 'none';

      pinBtn.classList.toggle('active', Boolean(state.isPinned));

      const src = state.artworkDataUrl || state.artworkUrl || '';
      if (src) {
        if (coverImg.src !== src) coverImg.src = src;
        coverImg.style.display = 'block';
        coverPlaceholder.style.display = 'none';
      } else {
        coverImg.style.display = 'none';
        coverPlaceholder.style.display = 'block';
      }

      if (!isAdjustingVolume && typeof state.volume === 'number') {
        volumeRange.value = state.muted ? 0 : Math.round(state.volume * 100);
      }
    });

    window.miniPlayerAPI.onTimeUpdate((time) => {
      updateProgress(time);
    });

    window.miniPlayerAPI.onThemeUpdate((theme) => {
      if (!theme || !theme.primary || !theme.secondary) return;
      const p = theme.primary;
      const s = theme.secondary;
      document.documentElement.style.setProperty('--c1', `rgba(${p[0]}, ${p[1]}, ${p[2]}, 0.30)`);
      document.documentElement.style.setProperty('--c2', `rgba(${s[0]}, ${s[1]}, ${s[2]}, 0.26)`);
      document.documentElement.style.setProperty('--accent', `rgb(${p[0]}, ${p[1]}, ${p[2]})`);
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      window.miniPlayerAPI.sendCommand('previous');
    });
    document.getElementById('playPauseBtn').addEventListener('click', () => {
      window.miniPlayerAPI.sendCommand('toggle');
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      window.miniPlayerAPI.sendCommand('next');
    });
    document.getElementById('openMainBtn').addEventListener('click', () => {
      window.miniPlayerAPI.openMainWindow();
    });
    document.getElementById('closeBtn').addEventListener('click', () => {
      window.miniPlayerAPI.close();
    });
    pinBtn.addEventListener('click', async () => {
      const pinned = await window.miniPlayerAPI.togglePin();
      pinBtn.classList.toggle('active', Boolean(pinned));
    });

    progressBar.addEventListener('click', (e) => {
      if (durationSec <= 0) return;
      const rect = progressBar.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      window.miniPlayerAPI.seek(ratio * durationSec);
    });

    volumeRange.addEventListener('pointerdown', () => { isAdjustingVolume = true; });
    volumeRange.addEventListener('pointerup', () => { isAdjustingVolume = false; });
    volumeRange.addEventListener('input', () => {
      window.miniPlayerAPI.setVolume(Number(volumeRange.value) / 100);
    });
  </script>
</body>
</html>
