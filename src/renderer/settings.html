<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';"
  />
  <title>YT Music Client Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="ytmc-settings-shell">
    <header class="ytmc-settings-header">
      <div class="ytmc-title-wrap">
        <span class="ytmc-brand-badge" aria-hidden="true"></span>
        <h1 id="modalTitle" class="ytmc-modal-title">YT Music Client Settings</h1>
      </div>
      <button id="closeBtn" type="button" class="ytmc-modal-close" title="Close (Esc)" aria-label="Close (Esc)">✕</button>
    </header>

    <div class="ytmc-tabs-pill" role="tablist">
      <button id="tabGeneralBtn" type="button" class="ytmc-tab-btn active" role="tab" aria-selected="true">General</button>
      <button id="tabAuthBtn" type="button" class="ytmc-tab-btn" role="tab" aria-selected="false">Google Sign-In</button>
    </div>

    <div id="bodyContainer" class="ytmc-settings-body"></div>

    <div id="hintText" class="ytmc-hint">Tip: press Ctrl+, anytime to open or close this window.</div>
  </main>

  <script src="settings.js"></script>
</body>
</html>
